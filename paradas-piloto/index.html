<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard de Paradas</title><style>body{font-family:Arial,sans-serif;background:#f4f7fb;margin:0;color:#13263f}.login{min-height:100vh;display:grid;place-items:center}.box{background:#fff;width:min(420px,88vw);padding:34px;border-radius:18px;box-shadow:0 16px 44px #18395d22}.brand{font-weight:800;letter-spacing:.07em;color:#17508d}.muted{color:#718095;margin:8px 0 24px}input,button{box-sizing:border-box;padding:14px;border-radius:10px;font-size:16px}input{width:100%;border:1px solid #cdd8e5}button{border:0;background:#17508d;color:#fff;font-weight:800;cursor:pointer}.box button{width:100%;margin-top:12px}.err{display:none;background:#fff0f0;color:#a12525;padding:10px;border-radius:8px;margin-top:10px}.top{background:#fff;border-bottom:1px solid #e2e9f1;padding:17px 22px;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1500px;margin:auto;padding:24px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card,.table{background:#fff;border-radius:16px;box-shadow:0 8px 26px #17375c12}.card{padding:22px}.train{font-weight:800;color:#17508d}.big{font-size:38px;font-weight:800;margin-top:7px}.row{display:flex;gap:20px;margin-top:14px;font-size:14px}.table{margin-top:20px;overflow:auto}table{border-collapse:collapse;width:100%;min-width:1100px}th,td{padding:11px;border-bottom:1px solid #edf1f5;text-align:left;font-size:13px;vertical-align:top}th{background:#eef4fa;color:#234c79;position:sticky;top:0}.status{color:#607187;margin-bottom:16px;font-size:13px}.logout{background:none;color:#17508d;padding:0}.hide{display:none}@media(max-width:760px){.cards{grid-template-columns:1fr}.wrap{padding:14px}}</style></head><body><div id="login" class="login"><form class="box" id="form"><div class="brand">PARADAS · TL1 / TL2 / TL3</div><h1>Dashboard de Paradas</h1><div class="muted">Acceso al piloto operacional.</div><input id="password" type="password" placeholder="Contraseña" required autofocus><button type="submit">INGRESAR</button><div class="err" id="err">Contraseña incorrecta</div></form></div><div id="app" class="hide"><div class="top"><div class="brand">PARADAS · PILOTO INDEPENDIENTE</div><button class="logout" id="logout">Cerrar sesión</button></div><div class="wrap"><h1>Dashboard de Paradas</h1><div id="status" class="status">Cargando...</div><div id="cards" class="cards"></div><div class="table"><table><thead><tr><th>Fecha</th><th>Tren</th><th>Turno</th><th>Inicio</th><th>Fin</th><th>Min</th><th>Equipo</th><th>Tipo</th><th>Descripción</th><th>Estado</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><script>const EXPECT='1e5b702350a3f465e9a0b1a705434e6d255fd238789342a72093a86113742983';const nums=[54,108,99,72,110,71,66,113,110,86,84,55,79,108,87,66,74,52,89,66,95,114,99,77,76,77,121,67,107,121,45];const view='6lcHnGBqnVT7OlWBJ4YB_rcMLMMyCky-';const api='https://wmhihelmtunvbtzbreja.supabase.co/functions/v1/paradas-piloto?view='+encodeURIComponent(view);const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]));async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}async function load(){const r=await fetch(api,{cache:'no-store'});if(!r.ok){document.getElementById('status').textContent='Error de lectura: '+r.status;return}const d=await r.json();document.getElementById('status').textContent='Actualización automática cada 20 segundos · '+d.events.length+' registros en nube';document.getElementById('cards').innerHTML=['TL1','TL2','TL3'].map(t=>`<div class="card"><div class="train">${t}</div><div class="big">${d.summary[t]?.count||0}</div><div class="muted">paradas registradas</div><div class="row"><span>${Math.round(d.summary[t]?.minutes||0)} min</span><span>${d.summary[t]?.active||0} en curso</span></div></div>`).join('');document.getElementById('rows').innerHTML=d.events.slice(0,150).map(x=>`<tr><td>${esc(x.fecha)}</td><td><b>${esc(x.tren)}</b></td><td>${esc(x.turno)}</td><td>${esc(x.inicio)}</td><td>${esc(x.fin)}</td><td>${esc(x.duracion_min)}</td><td>${esc(x.equipo)}</td><td>${esc(x.tipo)}</td><td>${esc(x.descripcion)}</td><td>${esc(x.estado)}</td></tr>`).join('')}function enter(){document.getElementById('login').classList.add('hide');document.getElementById('app').classList.remove('hide');sessionStorage.setItem('paradas_auth','1');load()}document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();if(await sha(document.getElementById('password').value)===EXPECT){document.getElementById('err').style.display='none';enter()}else document.getElementById('err').style.display='block'});document.getElementById('logout').onclick=()=>{sessionStorage.removeItem('paradas_auth');location.reload()};if(sessionStorage.getItem('paradas_auth')==='1')enter();setInterval(()=>{if(sessionStorage.getItem('paradas_auth')==='1')load()},20000);</script></body></html>
